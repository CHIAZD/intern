<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Good Receive Note</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            margin: 30px;

            background: #f5f5f5;

        }


        h1 {

            margin-bottom: 20px;

        }


        .section {

            background: white;

            padding: 20px;

            margin-bottom: 20px;

            border: 1px solid #ddd;

        }


        .form-row {

            display: flex;

            gap: 20px;

            margin-bottom: 15px;

        }


        .form-group {

            flex: 1;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 5px;

        }


        input,
        textarea {

            width: 100%;

            padding: 8px;

            box-sizing: border-box;

            background: #f5f5f5;

            border: 1px solid #ccc;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;

        }


        th,
        td {

            border: 1px solid #ccc;

            padding: 8px;

            text-align: center;

        }


        th {

            background: #eee;

        }


        .total-box {

            text-align: right;

            margin-top: 20px;

            font-size: 18px;

            font-weight: bold;

        }


        .back-btn {

            background: #555;

            color: white;

            padding: 10px 20px;

            border: none;

            cursor: pointer;

        }


        .edit-btn {

            background: #1769aa;

            color: white;

            padding: 10px 20px;

            border: none;

            cursor: pointer;

            margin-left: 5px;

        }


        .packing-btn {

            background: #2e7d32;

            color: white;

            padding: 10px 20px;

            border: none;

            cursor: pointer;

            margin-left: 5px;

        }


        .loading {

            text-align: center;

            padding: 30px;

        }


        .error {

            background: #f8d7da;

            color: #721c24;

            padding: 15px;

        }


        .grn-tabs {

            display: flex;

            gap: 5px;

            margin-bottom: 20px;

            border-bottom: 1px solid #ccc;

        }


        .tab-btn {

            background: #eee;

            color: #333;

            border: 1px solid #ccc;

            padding: 10px 20px;

            cursor: pointer;

        }


        .tab-btn.active {

            background: #1769aa;

            color: white;

            border-color: #1769aa;

        }


        .tab-content {

            width: 100%;

        }


    </style>

</head>


<body>


<h1>Good Receive Note</h1>


<div id="loading" class="loading">

    Loading GRN...

</div>


<div id="error"></div>


<div
    id="grnContent"
    style="display:none;"
>


    <!-- =====================================================
         GRN INFORMATION
    ====================================================== -->

    <div class="section">

        <h2>GRN Information</h2>


        <div class="form-row">

            <div class="form-group">

                <label>GRN Number</label>

                <input
                    type="text"
                    id="grnId"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>GRN Date</label>

                <input
                    type="date"
                    id="grnDate"
                    readonly
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Status</label>

                <input
                    type="text"
                    id="status"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>Total Amount</label>

                <input
                    type="text"
                    id="totalAmount"
                    readonly
                >

            </div>

        </div>


    </div>



    <!-- =====================================================
         GRN ITEMS
    ====================================================== -->

    <div class="section">


        <div class="grn-tabs">


            <button
                type="button"
                class="tab-btn active"
                id="grnItemsTab"
                onclick="showGRNItems()"
            >

                GRN Items

            </button>


            <button
                type="button"
                class="tab-btn"
                id="othersTab"
                onclick="showOthers()"
            >

                Others

            </button>


        </div>



        <!-- =================================================
             GRN ITEMS TAB
        ================================================== -->

        <div
            id="grnItemsContent"
            class="tab-content"
        >


            <table>

                <thead>

                    <tr>

                        <th>No.</th>

                        <th>Item Code</th>

                        <th>Item Name</th>

                        <th>QTY</th>

                        <th>UOM</th>

                        <th>QTY/Carton</th>

                        <th>Total QTY</th>

                        <th>Unit Price</th>

                        <th>Sub Total</th>

                    </tr>

                </thead>


                <tbody id="itemsBody">

                </tbody>

            </table>


            <div class="total-box">

                Total Amount:

                <span id="itemsTotalAmount">
                    RM 0.00
                </span>

            </div>


        </div>



        <!-- =================================================
             OTHERS TAB
        ================================================== -->

        <div
            id="othersContent"
            class="tab-content"
            style="display:none;"
        >


            <div class="form-row">

                <div class="form-group">

                    <label>Created By</label>

                    <input
                        type="text"
                        id="createdBy"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label>Created At</label>

                    <input
                        type="text"
                        id="createdAt"
                        readonly
                    >

                </div>

            </div>



            <div class="form-row">

                <div class="form-group">

                    <label>ETD</label>

                    <input
                        type="text"
                        id="etd"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label>ETA</label>

                    <input
                        type="text"
                        id="eta"
                        readonly
                    >

                </div>

            </div>



            <div class="form-row">

                <div class="form-group">

                    <label>Exchange Rate</label>

                    <input
                        type="text"
                        id="exchangeRate"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label>Entry</label>

                    <input
                        type="text"
                        id="entry"
                        readonly
                    >

                </div>

            </div>



            <div class="form-row">

                <div class="form-group">

                    <label>Cost Per Entry</label>

                    <input
                        type="text"
                        id="costPerEntry"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label>Carton Number</label>

                    <input
                        type="text"
                        id="cartonNumber"
                        readonly
                    >

                </div>

            </div>


        </div>


    </div>



    <!-- =====================================================
         BUTTONS
    ====================================================== -->

    <div class="section">


        <button
            class="back-btn"
            onclick="goBack()"
        >

            Back

        </button>


        <button
            class="edit-btn"
            onclick="editCurrentGRN()"
        >

            Edit

        </button>


        <button
            class="packing-btn"
            onclick="exportPackingList()"
        >

            Export Packing List

        </button>


    </div>


</div>



<script>


/*
|--------------------------------------------------------------------------
| Get GRN ID
|--------------------------------------------------------------------------
*/

const params =
    new URLSearchParams(
        window.location.search
    );


const grnId =
    params.get("grn_id");



/*
|--------------------------------------------------------------------------
| Load GRN
|--------------------------------------------------------------------------
*/

async function loadGRN() {

    if (!grnId) {

        showError(
            "GRN ID is missing."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "../api/grn_view.php?grn_id="
                + encodeURIComponent(
                    grnId
                )
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Failed to load GRN."
            );

        }


        const grn =
            result.grn;


        const items =
            result.items || [];


        /*
        |--------------------------------------------------------------------------
        | GRN Information
        |--------------------------------------------------------------------------
        */

        document.getElementById(
            "grnId"
        ).value =
            grn.GRN_ID || "";


        document.getElementById(
            "grnDate"
        ).value =
            grn.GRN_Date || "";


        document.getElementById(
            "status"
        ).value =
            grn.Status || "";


        document.getElementById(
            "totalAmount"
        ).value =
            formatAmount(
                grn.Total_Amount
            );


        /*
        |--------------------------------------------------------------------------
        | Others
        |--------------------------------------------------------------------------
        */

        document.getElementById(
            "createdBy"
        ).value =
            grn.Created_By || "-";


        document.getElementById(
            "createdAt"
        ).value =
            grn.Created_At || "-";


        document.getElementById(
            "etd"
        ).value =
            grn.ETD_Date || "-";


        document.getElementById(
            "eta"
        ).value =
            grn.ETA_Date || "-";


        document.getElementById(
            "exchangeRate"
        ).value =
            grn.Exchange_Rate || "-";


        document.getElementById(
            "entry"
        ).value =
            grn.Entry || "-";


        document.getElementById(
            "costPerEntry"
        ).value =
            grn.Cost_Per_Entry || "0.00";


        document.getElementById(
            "cartonNumber"
        ).value =
            grn.Carton_Number || "-";


        /*
        |--------------------------------------------------------------------------
        | GRN Items
        |--------------------------------------------------------------------------
        */

        const tbody =
            document.getElementById(
                "itemsBody"
            );


        tbody.innerHTML = "";


        items.forEach(
            function (item, index) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.Product_ID
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.Item_Name
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.Quantity
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.UOM
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.Qty_Per_Carton
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            item.Total_Qty
                        )}
                    </td>

                    <td>
                        ${formatAmount(
                            item.Unit_Price_MYR
                        )}
                    </td>

                    <td>
                        ${formatAmount(
                            item.Sub_Total
                        )}
                    </td>

                `;


                tbody.appendChild(
                    row
                );

            }
        );


        /*
        |--------------------------------------------------------------------------
        | Items Total
        |--------------------------------------------------------------------------
        */

        document.getElementById(
            "itemsTotalAmount"
        ).textContent =
            "RM " +
            formatAmount(
                grn.Total_Amount
            );


        /*
        |--------------------------------------------------------------------------
        | Show Content
        |--------------------------------------------------------------------------
        */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "grnContent"
        ).style.display =
            "block";


    }
    catch (error) {

        console.error(error);

        showError(
            error.message
        );

    }

}



/*
|--------------------------------------------------------------------------
| GRN Items Tab
|--------------------------------------------------------------------------
*/

function showGRNItems() {

    document.getElementById(
        "grnItemsContent"
    ).style.display =
        "block";


    document.getElementById(
        "othersContent"
    ).style.display =
        "none";


    document.getElementById(
        "grnItemsTab"
    ).classList.add(
        "active"
    );


    document.getElementById(
        "othersTab"
    ).classList.remove(
        "active"
    );

}



/*
|--------------------------------------------------------------------------
| Others Tab
|--------------------------------------------------------------------------
*/

function showOthers() {

    document.getElementById(
        "grnItemsContent"
    ).style.display =
        "none";


    document.getElementById(
        "othersContent"
    ).style.display =
        "block";


    document.getElementById(
        "grnItemsTab"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "othersTab"
    ).classList.add(
        "active"
    );

}



/*
|--------------------------------------------------------------------------
| Back
|--------------------------------------------------------------------------
*/

function goBack() {

    window.location.href =
        "grn_list.html";

}



/*
|--------------------------------------------------------------------------
| Edit
|--------------------------------------------------------------------------
*/

function editCurrentGRN() {

    window.location.href =
        "grn_edit.html?grn_id=" +
        encodeURIComponent(
            grnId
        );

}



/*
|--------------------------------------------------------------------------
| Export Packing List
|--------------------------------------------------------------------------
*/

function exportPackingList() {

    window.location.href =
        "packing_list.html?grn_id=" +
        encodeURIComponent(
            grnId
        );

}



/*
|--------------------------------------------------------------------------
| Format Amount
|--------------------------------------------------------------------------
*/

function formatAmount(amount) {

    const number =
        parseFloat(
            amount
        ) || 0;


    return number.toFixed(2);

}



/*
|--------------------------------------------------------------------------
| Escape HTML
|--------------------------------------------------------------------------
*/

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/*
|--------------------------------------------------------------------------
| Error
|--------------------------------------------------------------------------
*/

function showError(message) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).innerHTML = `

        <div class="error">

            ${escapeHTML(message)}

        </div>

    `;

}



/*
|--------------------------------------------------------------------------
| Start
|--------------------------------------------------------------------------
*/

loadGRN();


</script>


</body>

</html>
