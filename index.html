<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Purchase Order</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            margin: 0px;

            background: #f5f5f5;

        }


        h1 {

            margin-bottom: 20px;

        }


        .section {

            background: white;

            padding: 20px;

            margin-bottom: 20px;

            border: 1px solid #ddd;

        }


        button {

            padding: 9px 16px;

            border: none;

            cursor: pointer;

        }


        .create-btn {

            background: #1769aa;

            color: white;

        }


        .refresh-btn {

            background: #555;

            color: white;

            margin-left: 5px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;

        }


        th,
        td {

            border: 1px solid #ccc;

            padding: 10px;

            text-align: center;

        }


        th {

            background: #eee;

        }


        .status {

            font-weight: bold;

        }


        .empty {

            text-align: center;

            padding: 30px;

            color: #777;

        }


        .error {

            background: #f8d7da;

            color: #721c24;

            padding: 10px;

            margin-top: 15px;

        }


        .loading {

            text-align: center;

            padding: 30px;

        }

        .filter-row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}

.filter-group {
    flex: 1;
}

.filter-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.filter-group input,
.filter-group select {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
}

.filter-buttons {
    display: flex;
    align-items: end;
    gap: 10px;
}

.filter-buttons button {
    padding: 9px 20px;
    border: none;
    cursor: pointer;
}


/* =========================================================
   TOP NAVIGATION BAR
========================================================= */

.top-bar {
    width: 100%;
    height: 55px;

    display: flex;
    align-items: center;

    background: #333;
    color: white;

    padding: 0 20px;

    box-sizing: border-box;

    margin-bottom: 25px;
}


/* System Name */

.top-bar-title {
    font-size: 18px;
    font-weight: bold;

    margin-right: 40px;

    white-space: nowrap;
}


/* Navigation */

.top-bar-nav {
    display: flex;
    align-items: center;

    gap: 5px;

    flex: 1;
}


/* Navigation Link */

.top-bar-nav a {
    color: white;

    text-decoration: none;

    padding: 10px 15px;

    white-space: nowrap;
}


/* Hover */

.top-bar-nav a:hover {
    background: #555;
}


/* User Area */

.top-bar-user {
    display: flex;
    align-items: center;

    gap: 15px;

    white-space: nowrap;
}


/* Logout */

.logout-btn {
    color: white;

    text-decoration: none;

    padding: 8px 12px;

    background: #555;
}

.logout-btn:hover {
    background: #777;
}

    </style>

</head>


<body>

    <div class="top-bar">

        <!-- System Name -->

        <div class="top-bar-title">
            Purchasing
        </div>


        <!-- Navigation -->

        <div class="top-bar-nav">

            <a href="../index.html">
                Purchase Order
            </a>

            <a href="grn/grn_list.html">
                Good Receive Note
            </a>

        </div>


        <!-- User -->

        <div class="top-bar-user">

            <span id="currentUser">
                User
            </span>

            <a
                href="../login.html"
                class="logout-btn"
                onclick="logout()"
            >
                Log out
            </a>

        </div>

    </div>
        
<h1>Purchase Order</h1>


<div class="section">

    <button
        class="create-btn"
        onclick="createPO()"
    >
        + Create New PO
    </button>


    <button
        class="refresh-btn"
        onclick="loadPOList()"
    >
        Refresh
    </button>

</div>


<div class="section">

    <h2>Search / Filter</h2>

    <div class="filter-row">

        <div class="filter-group">

            <label>Search</label>

            <input
                type="text"
                id="searchInput"
                placeholder="PO ID / Vendor / Ref No"
            >

        </div>


        <div class="filter-group">

            <label>Vendor</label>

            <select id="vendorFilter">

                <option value="">
                    All Vendors
                </option>

            </select>

        </div>


        <div class="filter-group">

            <label>Status</label>

            <select id="statusFilter">

                <option value="">
                    All Status
                </option>

                <option value="CREATED">
                    CREATED
                </option>

                <option value="COMPLETED">
                    COMPLETED
                </option>

                <option value="CANCELLED">
                    CANCELLED
                </option>

                <option value="DRAFT">
                    DRAFT
                </option>

            </select>

        </div>

    </div>


    <div class="filter-row">

        <div class="filter-group">

            <label>Date From</label>

            <input
                type="date"
                id="dateFrom"
            >

        </div>


        <div class="filter-group">

            <label>Date To</label>

            <input
                type="date"
                id="dateTo"
            >

        </div>


        <div class="filter-buttons">

            <button
                type="button"
                onclick="searchPO()"
            >
                Search
            </button>


            <button
                type="button"
                onclick="resetFilter()"
            >
                Reset
            </button>

        </div>

    </div>

</div>

<div class="section">

    <h2>PO List</h2>


    <div id="loading" class="loading">

        Loading PO...

    </div>


    <div id="error"></div>


    <table id="poTable">

        <thead>

            <tr>

                <th>PO Number</th>

                <th>PO Date</th>

                <th>Vendor</th>

                <th>Total Qty</th>

                <th>Total Amount</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="poBody">

        </tbody>

    </table>

</div>


<script>


/*
|--------------------------------------------------------------------------
| Page Load
|--------------------------------------------------------------------------
*/

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        await loadVendorDropdown();

        loadPOList();

    }
);



/*
|--------------------------------------------------------------------------
| Load PO List
|--------------------------------------------------------------------------
*/

async function loadPOList() {

    const loading =
        document.getElementById(
            "loading"
        );


    const error =
        document.getElementById(
            "error"
        );


    const tbody =
        document.getElementById(
            "poBody"
        );


    loading.style.display =
        "block";


    error.innerHTML = "";


    tbody.innerHTML = "";


    try {

        const response =
            await fetch(
                "api/po_list.php"
            );


        const result =
            await response.json();


        if (!result.success) {

            error.innerHTML =
                `<div class="error">
                    ${result.message}
                </div>`;

            loading.style.display =
                "none";

            return;

        }


        const orders =
            result.data;


        loading.style.display =
            "none";


        /*
         * No PO
         */

        if (orders.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td
                        colspan="7"
                        class="empty"
                    >
                        No Purchase Orders found.
                    </td>
                </tr>
            `;

            return;

        }


        /*
         * Display PO
         */

        orders.forEach(
            function (po) {

                const row =
                    document.createElement(
                        "tr"
                    );


                /*
                 * PO Number
                 */

                const poCell =
                    document.createElement(
                        "td"
                    );


                poCell.textContent =
                    po.PO_ID;


                /*
                 * Date
                 */

                const dateCell =
                    document.createElement(
                        "td"
                    );


                dateCell.textContent =
                    formatDate(
                        po.PO_Date
                    );


                /*
                 * Vendor
                 */

                const vendorCell =
                    document.createElement(
                        "td"
                    );


                vendorCell.textContent =
                    po.Vendor_ID +
                    " - " +
                    (
                        po.Vendor_CompanyName ||
                        "Unknown Vendor"
                    );


                /*
                 * Total Qty
                 */

                const qtyCell =
                    document.createElement(
                        "td"
                    );


                qtyCell.textContent =
                    po.Total_Qty;


                /*
                 * Amount
                 */

                const amountCell =
                    document.createElement(
                        "td"
                    );


                amountCell.textContent =
                    po.Currency +
                    " " +
                    parseFloat(
                        po.Total_Amount
                    ).toFixed(2);


                /*
                 * Status
                 */

                const statusCell =
                    document.createElement(
                        "td"
                    );


                statusCell.textContent =
                    po.Status;


                statusCell.className =
                    "status";


                /*
                 * Action
                 */

                const actionCell =
                    document.createElement(
                        "td"
                    );


                const viewButton =
                    document.createElement(
                        "button"
                    );


                viewButton.textContent =
                    "View";


                viewButton.onclick =
                    function () {

                        viewPO(
                            po.PO_ID
                        );

                    };


                actionCell.appendChild(
                    viewButton
                );


                /*
                 * Add cells
                 */

                row.appendChild(
                    poCell
                );

                row.appendChild(
                    dateCell
                );

                row.appendChild(
                    vendorCell
                );

                row.appendChild(
                    qtyCell
                );

                row.appendChild(
                    amountCell
                );

                row.appendChild(
                    statusCell
                );

                row.appendChild(
                    actionCell
                );


                tbody.appendChild(
                    row
                );

            }
        );


    } catch (error) {

        console.error(error);


        loading.style.display =
            "none";


        error.innerHTML =
            `
            <div class="error">
                Failed to connect to server.
            </div>
            `;

    }

}



/*
|--------------------------------------------------------------------------
| Format Date
|--------------------------------------------------------------------------
*/

function formatDate(dateString) {

    if (!dateString) {

        return "";

    }


    const parts =
        dateString.split("-");


    if (parts.length !== 3) {

        return dateString;

    }


    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}

/*
|--------------------------------------------------------------------------
| Render PO List
|--------------------------------------------------------------------------
*/

function renderPOList(orders) {

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");

    const tbody =
        document.getElementById("poBody");


    loading.style.display = "none";

    error.innerHTML = "";

    tbody.innerHTML = "";


    /*
    |--------------------------------------------------------------------------
    | No PO
    |--------------------------------------------------------------------------
    */

    if (!orders || orders.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="empty"
                >
                    No Purchase Orders found.
                </td>
            </tr>
        `;

        return;
    }


    /*
    |--------------------------------------------------------------------------
    | Display PO
    |--------------------------------------------------------------------------
    */

    orders.forEach(function (po) {

        const row =
            document.createElement("tr");


        /*
        |--------------------------------------------------------------------------
        | PO Number
        |--------------------------------------------------------------------------
        */

        const poCell =
            document.createElement("td");

        poCell.textContent =
            po.PO_ID;


        /*
        |--------------------------------------------------------------------------
        | Date
        |--------------------------------------------------------------------------
        */

        const dateCell =
            document.createElement("td");

        dateCell.textContent =
            formatDate(po.PO_Date);


        /*
        |--------------------------------------------------------------------------
        | Vendor
        |--------------------------------------------------------------------------
        */

        const vendorCell =
            document.createElement("td");

        vendorCell.textContent =
            po.Vendor_ID +
            " - " +
            (
                po.Vendor_CompanyName ||
                "Unknown Vendor"
            );


        /*
        |--------------------------------------------------------------------------
        | Total Qty
        |--------------------------------------------------------------------------
        */

        const qtyCell =
            document.createElement("td");

        qtyCell.textContent =
            po.Total_Qty;


        /*
        |--------------------------------------------------------------------------
        | Amount
        |--------------------------------------------------------------------------
        */

        const amountCell =
            document.createElement("td");

        amountCell.textContent =
            po.Currency +
            " " +
            parseFloat(
                po.Total_Amount
            ).toFixed(2);


        /*
        |--------------------------------------------------------------------------
        | Status
        |--------------------------------------------------------------------------
        */

        const statusCell =
            document.createElement("td");

        statusCell.textContent =
            po.Status;

        statusCell.className =
            "status";


        /*
        |--------------------------------------------------------------------------
        | Action
        |--------------------------------------------------------------------------
        */

        const actionCell =
            document.createElement("td");


        const viewButton =
            document.createElement("button");

        viewButton.textContent =
            "View";


        viewButton.onclick =
            function () {

                viewPO(po.PO_ID);

            };


        actionCell.appendChild(
            viewButton
        );


        /*
        |--------------------------------------------------------------------------
        | Add Cells
        |--------------------------------------------------------------------------
        */

        row.appendChild(
            poCell
        );

        row.appendChild(
            dateCell
        );

        row.appendChild(
            vendorCell
        );

        row.appendChild(
            qtyCell
        );

        row.appendChild(
            amountCell
        );

        row.appendChild(
            statusCell
        );

        row.appendChild(
            actionCell
        );


        tbody.appendChild(
            row
        );

    });

}

/*
|--------------------------------------------------------------------------
| Create PO
|--------------------------------------------------------------------------
*/

function createPO() {

    /*
     * For now we will create a separate
     * PO create page later.
     */

    window.location.href =
        "po/po_create.html";

}



/*
|--------------------------------------------------------------------------
| View PO
|--------------------------------------------------------------------------
*/

function viewPO(poId) {

    /*
     * View page will be created next.
     */

    window.location.href =
        "po/po_view.html?po_id=" +
        encodeURIComponent(poId);

}

async function searchPO() {

    const search =
        document.getElementById(
            "searchInput"
        ).value.trim();


    const vendorId =
        document.getElementById(
            "vendorFilter"
        ).value;


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const dateFrom =
        document.getElementById(
            "dateFrom"
        ).value;


    const dateTo =
        document.getElementById(
            "dateTo"
        ).value;


    const params =
        new URLSearchParams();


    if (search !== "") {

        params.set(
            "search",
            search
        );

    }


    if (vendorId !== "") {

        params.set(
            "vendor_id",
            vendorId
        );

    }


    if (status !== "") {

        params.set(
            "status",
            status
        );

    }


    if (dateFrom !== "") {

        params.set(
            "date_from",
            dateFrom
        );

    }


    if (dateTo !== "") {

        params.set(
            "date_to",
            dateTo
        );

    }


    try {

        const response =
            await fetch(
                "api/po_list.php?" +
                params.toString()
            );


        const result =
            await response.json();


        if (!result.success) {

            alert(
                result.message
            );

            return;

        }


renderPOList(
    result.data
);


    } catch (error) {

        console.error(error);

        alert(
            "Failed to search PO."
        );

    }

}

function resetFilter() {

    document.getElementById(
        "searchInput"
    ).value = "";


    document.getElementById(
        "vendorFilter"
    ).value = "";


    document.getElementById(
        "statusFilter"
    ).value = "";


    document.getElementById(
        "dateFrom"
    ).value = "";


    document.getElementById(
        "dateTo"
    ).value = "";


    loadPOList();

}

/*
|--------------------------------------------------------------------------
| Load Vendor Dropdown
|--------------------------------------------------------------------------
*/

async function loadVendorDropdown() {

    const vendorFilter =
        document.getElementById("vendorFilter");

    try {

        const response =
            await fetch("api/vendors.php");

        const result =
            await response.json();

        if (!result.success) {

            console.error(
                "Failed to load vendors:",
                result.message
            );

            return;
        }

        /*
        |--------------------------------------------------------------------------
        | Keep All Vendors
        |--------------------------------------------------------------------------
        */

        vendorFilter.innerHTML = `
            <option value="">
                All Vendors
            </option>
        `;


        /*
        |--------------------------------------------------------------------------
        | Add Vendors
        |--------------------------------------------------------------------------
        */

        result.data.forEach(function (vendor) {

            const option =
                document.createElement("option");

            option.value =
                vendor.Vendor_ID;

            option.textContent =
                vendor.Vendor_ID +
                " - " +
                vendor.Vendor_CompanyName;

            vendorFilter.appendChild(option);

        });


    } catch (error) {

        console.error(
            "Failed to load vendor dropdown:",
            error
        );

    }
}

async function loadVendorFilter() {

    try {

        const response =
            await fetch("api/vendors.php");

        const result =
            await response.json();

        console.log("Vendor Response:", result);

        if (!result.success) {

            console.error(
                "Failed to load vendors:",
                result.message
            );

            return;
        }

        const select =
            document.getElementById("vendorFilter");

        select.innerHTML = `
            <option value="">
                All Vendors
            </option>
        `;

        result.data.forEach(function (vendor) {

            const option =
                document.createElement("option");

            option.value =
                vendor.Vendor_ID;

            option.textContent =
                vendor.Vendor_ID +
                " - " +
                vendor.Vendor_CompanyName;

            select.appendChild(option);

        });

    } catch (error) {

        console.error(
            "Failed to load vendors:",
            error
        );

    }
}

function logout() {

    window.location.href =
        "../logout.php";

}

async function loadCurrentUser() {

    try {

        const response =
            await fetch(
                "../api/current_user.php"
            );

        const result =
            await response.json();


        if (
            result.success &&
            result.data
        ) {

            document.getElementById(
                "currentUser"
            ).textContent =
                result.data.username;

        }

    }
    catch (error) {

        console.error(
            "Failed to load current user:",
            error
        );

    }

}
</script>


</body>

</html>
