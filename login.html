<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Purchasing System - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 380px;
            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;

            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 14px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 5px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 10px;

            border-radius: 5px;

            display: none;

            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>Purchasing System</h1>

    <div class="subtitle">
        Please login to continue
    </div>


    <form id="loginForm">


        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


</div>


<script>


const loginForm =
    document.getElementById("loginForm");


const loginButton =
    document.getElementById("loginButton");


const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.style.display = "none";


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {


            const response =
                await fetch(
                    "api/login.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username:
                                    username,

                                password:
                                    password
                            })
                    }
                );


            const result =
                await response.json();


            if (!result.success) {

                showMessage(
                    result.message,
                    false
                );

                return;
            }


            showMessage(
                "Login successful. Redirecting...",
                true
            );


            /*
            |--------------------------------------------------------------------------
            | Go To Main Page
            |--------------------------------------------------------------------------
            */

            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                500
            );


        } catch (error) {


            console.error(error);


            showMessage(
                "Unable to connect to server.",
                false
            );


        } finally {


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);


function showMessage(
    text,
    success
) {

    message.textContent =
        text;

    message.className =
        "message " +
        (
            success
                ? "success"
                : "error"
        );

    message.style.display =
        "block";
}


</script>


</body>

</html>
