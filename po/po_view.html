<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Purchase Order</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            margin: 30px;

            background: #f5f5f5;

        }


        h1 {

            margin-bottom: 20px;

        }


        .section {

            background: white;

            padding: 20px;

            margin-bottom: 20px;

            border: 1px solid #ddd;

        }


        .form-row {

            display: flex;

            gap: 20px;

            margin-bottom: 15px;

        }


        .form-group {

            flex: 1;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 5px;

        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 8px;

            box-sizing: border-box;

            background: #f5f5f5;

        }


        textarea {

            resize: vertical;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;

        }


        th,
        td {

            border: 1px solid #ccc;

            padding: 8px;

            text-align: center;

        }


        th {

            background: #eee;

        }


        .total-box {

            text-align: right;

            margin-top: 20px;

            font-size: 18px;

            font-weight: bold;

        }


        .back-btn {

            background: #555;

            color: white;

            padding: 10px 20px;

            border: none;

            cursor: pointer;

        }


        .edit-btn {

            background: #1769aa;

            color: white;

            padding: 10px 20px;

            border: none;

            cursor: pointer;

            margin-left: 5px;

        }


        .loading {

            text-align: center;

            padding: 30px;

        }


        .error {

            background: #f8d7da;

            color: #721c24;

            padding: 15px;

        }

        .delete-btn {

    background: #c0392b;

    color: white;

    padding: 10px 20px;

    border: none;

    cursor: pointer;

    margin-left: 5px;

}
.download-btn {
    background: #2e7d32;
    color: white;
    padding: 10px 16px;
    border: none;
    cursor: pointer;
    margin-left: 5px;
    font-size: 18px;
    font-weight: bold;
}

.download-btn:hover {
    opacity: 0.85;
}


.po-tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 20px;
    border-bottom: 1px solid #ccc;
}

.tab-btn {
    background: #eee;
    color: #333;
    border: 1px solid #ccc;
    padding: 10px 20px;
    cursor: pointer;
    margin-right: 0;
}

.tab-btn.active {
    background: #1769aa;
    color: white;
    border-color: #1769aa;
}

.tab-content {
    width: 100%;
}


    </style>

</head>


<body>


<h1>Purchase Order</h1>


<div id="loading" class="loading">

    Loading PO...

</div>


<div id="error"></div>


<div id="poContent" style="display:none;">


    <!-- =====================================================
         PO INFORMATION
    ====================================================== -->

    <div class="section">

        <h2>PO Information</h2>


        <div class="form-row">

            <div class="form-group">

                <label>PO Number</label>

                <input
                    type="text"
                    id="poNumber"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>PO Date</label>

                <input
                    type="date"
                    id="poDate"
                    readonly
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Supplier / Vendor</label>

                <input
                    type="text"
                    id="vendor"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>Ref No</label>

                <input
                    type="text"
                    id="refNo"
                    readonly
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Currency</label>

                <input
                    type="text"
                    id="currency"
                    readonly
                >

            </div>

            <div class="form-group">

                <label>Status</label>

                <input
                    type="text"
                    id="status"
                    readonly
            >

        </div>


        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea
                id="description"
                rows="3"
                readonly
            ></textarea>

        </div>

        <div class="form-group">

            <label>Photo</label>

            <div id="photoContainer">

                No photo uploaded.

        </div>

</div>

    </div>



    <!-- =====================================================
         PO ITEMS
    ====================================================== -->

    <div class="section">

    <div class="po-tabs">

        <button
            type="button"
            class="tab-btn active"
            id="poItemsTab"
            onclick="showPOItems()"
        >
            PO Items
        </button>

        <button
            type="button"
            class="tab-btn"
            id="othersTab"
            onclick="showOthers()"
        >
            Others
        </button>

    </div>


    <div
        id="poItemsContent"
        class="tab-content"
    >

        <table>

            <thead>

                <tr>

                    <th>No.</th>

                    <th>Item Code</th>

                    <th>Item Name</th>

                    <th>Quantity</th>

                    <th>UOM</th>

                    <th>Unit Price</th>

                    <th>Sub Total</th>

                    <th>Stock Qty</th>

                </tr>

            </thead>


            <tbody id="itemsBody">

            </tbody>

        </table>
    </div>

     <div
        id="othersContent"
        class="tab-content"
        style="display:none;"
    >
<div class="form-row">

    <div class="form-group">

        <label>Created By</label>

        <input
            type="text"
            id="createdBy"
            readonly
        >

    </div>

        <div class="form-group">

        <label>Prepared Date</label>

        <input
            type="date"
            id="preparedDate"
            readonly
        >

    </div>

</div>

        <div class="total-box">

            <div>

                Total Qty:

                <span id="totalQty">
                    0
                </span>

            </div>


            <div>

                Total Amount:

                <span id="totalAmount">
                    RM 0.00
                </span>

            </div>

        </div>

    </div>




    <!-- =====================================================
         BUTTONS
    ====================================================== -->

    <div class="section">

<button
    class="back-btn"
    onclick="goBack()"
>
    Back
</button>

<button
    class="edit-btn"
    onclick="editPO()"
    id="editButton"
>
    Edit

</button>

<button
    class="delete-btn"
    id="deleteButton"
    onclick="deletePO()"
>
    Delete
</button>

<button
    class="download-btn"
    onclick="downloadPO()"
    title="Download / Print PO"
>
    ↓
</button>

    </div>


</div>



<script>
let currentUser = null;

async function checkUserPermission() {

    try {

        const response =
            await fetch("../api/auth.php");

        const result =
            await response.json();

        if (!result.success) {

            window.location.href =
                "../login.html";

            return false;
        }

        currentUser =
            result.data;

        return true;

    } catch (error) {

        console.error(
            "Auth check failed:",
            error
        );

        window.location.href =
            "../login.html";

        return false;
    }
}
/*
|--------------------------------------------------------------------------
| Get PO ID from URL
|--------------------------------------------------------------------------
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const poId =
    urlParams.get("po_id");


/*
|--------------------------------------------------------------------------
| Load PO
|--------------------------------------------------------------------------
*/

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        const authenticated =
            await checkUserPermission();

        if (!authenticated) {
            return;
        }

        applyPermissions();

        loadPO();

    }
);


/*
|--------------------------------------------------------------------------
| Load PO API
|--------------------------------------------------------------------------
*/

async function loadPO() {

    try {

        const response =
            await fetch(
                "../api/po_view.php?po_id=" +
                encodeURIComponent(
                    poId
                )
            );


        const result =
            await response.json();


        if (!result.success) {

            showError(
                result.message
            );

            return;

        }


        displayPO(
            result.data
        );


    } catch (error) {

        console.error(error);

        showError(
            "Failed to connect to server."
        );

    }

}


/*
|--------------------------------------------------------------------------
| Display PO
|--------------------------------------------------------------------------
*/

function displayPO(data) {

    const header =
        data.header;

    /*
|--------------------------------------------------------------------------
| Photo
|--------------------------------------------------------------------------
*/

const photoContainer =
    document.getElementById(
        "photoContainer"
    );


if (header.Photo_Path) {

    photoContainer.innerHTML = `

        <img
            src="${escapeHTML(
                header.Photo_Path
            )}"
            alt="PO Photo"
            style="
                max-width: 500px;
                max-height: 500px;
                object-fit: contain;
                border: 1px solid #ccc;
            "
        >

    `;

} else {

    photoContainer.textContent =
        "No photo uploaded.";

}


    const items =
        data.items;


    /*
     * Header
     */

    document.getElementById(
        "poNumber"
    ).value =
        header.PO_ID;


    document.getElementById(
        "poDate"
    ).value =
        header.PO_Date;


    document.getElementById(
        "vendor"
    ).value =
        header.Vendor_ID +
        " - " +
        (
            header.Vendor_CompanyName ||
            ""
        );


    document.getElementById(
        "refNo"
    ).value =
        header.Ref_No ||
        "";


    document.getElementById(
        "currency"
    ).value =
        header.Currency;


    document.getElementById(
        "preparedDate"
    ).value =
        header.Prepared_Date ||
        "";


    document.getElementById(
        "description"
    ).value =
        header.Description ||
        "";


    document.getElementById(
        "createdBy"
    ).value =
        header.Created_By ||
        "";


    document.getElementById(
        "status"
    ).value =
        header.Status ||
        "";


    /*
     * Items
     */

    const tbody =
        document.getElementById(
            "itemsBody"
        );


    tbody.innerHTML = "";


    items.forEach(
        function (item, index) {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHTML(
                        item.Product_ID
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        item.Item_Name
                    )}
                </td>

                <td>
                    ${item.Quantity}
                </td>

                <td>
                    ${escapeHTML(
                        item.UOM
                    )}
                </td>

                <td>
                    ${parseFloat(
                        item.Unit_Price
                    ).toFixed(2)}
                </td>

                <td>
                    ${parseFloat(
                        item.Sub_Total
                    ).toFixed(2)}
                </td>

                <td>
                    ${item.Stock_Qty}
                </td>

            `;


            tbody.appendChild(
                row
            );

        }
    );


    /*
     * Totals
     */

    document.getElementById(
        "totalQty"
    ).textContent =
        header.Total_Qty;


    document.getElementById(
        "totalAmount"
    ).textContent =
        header.Currency +
        " " +
        parseFloat(
            header.Total_Amount
        ).toFixed(2);


    /*
     * Show page
     */

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "poContent"
    ).style.display =
        "block";

}


/*
|--------------------------------------------------------------------------
| Escape HTML
|--------------------------------------------------------------------------
*/

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/*
|--------------------------------------------------------------------------
| Back
|--------------------------------------------------------------------------
*/

function goBack() {

    window.location.href =
        "../index.html";

}


/*
|--------------------------------------------------------------------------
| Edit
|--------------------------------------------------------------------------
*/

function editPO() {

    window.location.href =
        "po_edit.html?po_id=" +
        encodeURIComponent(
            poId
        );

}

function applyPermissions() {

    const editButton =
        document.getElementById("editButton");

    const deleteButton =
        document.getElementById("deleteButton");

    const userLevel =
        Number(currentUser.user_level);


    /*
    |--------------------------------------------------------------------------
    | Level 1
    |--------------------------------------------------------------------------
    */

    if (userLevel === 1) {

        if (editButton) {
            editButton.style.display = "none";
        }

        if (deleteButton) {
            deleteButton.style.display = "none";
        }

    }


    /*
    |--------------------------------------------------------------------------
    | Level 2
    |--------------------------------------------------------------------------
    */

    else if (userLevel === 2) {

        if (editButton) {
            editButton.style.display = "inline-block";
        }

        if (deleteButton) {
            deleteButton.style.display = "inline-block";
        }

    }

}

/*
|--------------------------------------------------------------------------
| Error
|--------------------------------------------------------------------------
*/

function showError(message) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).innerHTML = `

        <div class="error">
            ${escapeHTML(message)}
        </div>

    `;

}

/*
|--------------------------------------------------------------------------
| Delete
|--------------------------------------------------------------------------
*/

async function deletePO() {

    const confirmed =
        confirm(
            "Are you sure you want to delete PO " +
            poId +
            "?\n\n" +
            "This action cannot be undone."
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                "../api/po_delete.php",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            po_id:
                                poId

                        })

                }
            );


        const result =
            await response.json();


        if (!result.success) {

            alert(
                "Failed to delete PO:\n" +
                result.message
            );

            return;

        }


        alert(
            "PO " +
            poId +
            " deleted successfully."
        );


        /*
        |--------------------------------------------------------------------------
        | Return to PO List
        |--------------------------------------------------------------------------
        */

        window.location.href =
            "../index.html";


    } catch (error) {

        console.error(error);


        alert(
            "Server error while deleting PO."
        );

    }

}

function showPOItems() {

    document.getElementById(
        "poItemsContent"
    ).style.display = "block";

    document.getElementById(
        "othersContent"
    ).style.display = "none";


    document.getElementById(
        "poItemsTab"
    ).classList.add("active");

    document.getElementById(
        "othersTab"
    ).classList.remove("active");

}


function showOthers() {

    document.getElementById(
        "poItemsContent"
    ).style.display = "none";

    document.getElementById(
        "othersContent"
    ).style.display = "block";


    document.getElementById(
        "poItemsTab"
    ).classList.remove("active");

    document.getElementById(
        "othersTab"
    ).classList.add("active");

}


</script>


</body>

</html>
