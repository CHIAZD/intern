<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Product</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
        }

        h1 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .create-btn {
            background: #1769aa;
        }

        .back-btn {
            background: #555;
            margin-left: 5px;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Create Product</h1>

    <div
        id="message"
        class="message"
    ></div>

    <div class="form-group">

        <label>
            Product ID
        </label>

        <input
            type="text"
            id="productId"
            maxlength="20"
        >

    </div>

    <div class="form-group">

        <label>
            Product Description
        </label>

        <input
            type="text"
            id="productDescription"
            maxlength="255"
        >

    </div>

    <div class="form-group">

        <label>
            Product Packing Size
        </label>

        <input
            type="text"
            id="packingSize"
            maxlength="100"
        >

    </div>

    <div class="form-group">

        <label>
            Product Pcs per Carton
        </label>

        <input
            type="number"
            id="pcsPerCarton"
            min="0"
        >

    </div>

    <button
        class="create-btn"
        id="createButton"
        onclick="createProduct()"
    >
        Create Product
    </button>

    <button
        class="back-btn"
        onclick="goBack()"
    >
        Back
    </button>

</div>


<script>

let currentUser = null;


/*
|--------------------------------------------------------------------------
| Check Authentication
|--------------------------------------------------------------------------
*/

async function checkUserPermission() {

    try {

        const response =
            await fetch("api/auth.php");

        const result =
            await response.json();

        if (!result.success) {

            window.location.href =
                "login.html";

            return false;
        }

        currentUser =
            result.data;


        /*
        |--------------------------------------------------------------------------
        | Level 2 Only
        |--------------------------------------------------------------------------
        */

        if (
            Number(currentUser.user_level) !== 2
        ) {

            alert(
                "Permission denied. Level 2 is required."
            );

            window.location.href =
                "index.html";

            return false;
        }

        return true;

    } catch (error) {

        console.error(error);

        window.location.href =
            "login.html";

        return false;
    }
}


/*
|--------------------------------------------------------------------------
| Page Load
|--------------------------------------------------------------------------
*/

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        await checkUserPermission();

    }
);


/*
|--------------------------------------------------------------------------
| Create Product
|--------------------------------------------------------------------------
*/

async function createProduct() {

    clearMessage();


    const productId =
        document
            .getElementById("productId")
            .value
            .trim();


    const description =
        document
            .getElementById("productDescription")
            .value
            .trim();


    const packingSize =
        document
            .getElementById("packingSize")
            .value
            .trim();


    const pcsPerCartonValue =
        document
            .getElementById("pcsPerCarton")
            .value;


    /*
    |--------------------------------------------------------------------------
    | Validation
    |--------------------------------------------------------------------------
    */

    if (!productId) {

        showMessage(
            "Product ID is required.",
            false
        );

        return;
    }


    if (!description) {

        showMessage(
            "Product Description is required.",
            false
        );

        return;
    }


    let pcsPerCarton = null;


    if (pcsPerCartonValue !== "") {

        pcsPerCarton =
            parseInt(
                pcsPerCartonValue
            );


        if (
            isNaN(pcsPerCarton) ||
            pcsPerCarton < 0
        ) {

            showMessage(
                "Product Pcs per Carton must be 0 or greater.",
                false
            );

            return;
        }
    }


    /*
    |--------------------------------------------------------------------------
    | Disable Button
    |--------------------------------------------------------------------------
    */

    const button =
        document.getElementById(
            "createButton"
        );


    button.disabled = true;

    button.textContent =
        "Creating...";


    try {

        const response =
            await fetch(
                "api/product_create.php",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            product_id:
                                productId,

                            product_description:
                                description,

                            product_packing_size:
                                packingSize || null,

                            product_pcs_per_carton:
                                pcsPerCarton

                        })

                }
            );


        const result =
            await response.json();


        if (!result.success) {

            showMessage(
                result.message,
                false
            );

            return;
        }


        showMessage(
            "Product created successfully.",
            true
        );


        /*
        |--------------------------------------------------------------------------
        | Clear Form
        |--------------------------------------------------------------------------
        */

        document.getElementById(
            "productId"
        ).value = "";


        document.getElementById(
            "productDescription"
        ).value = "";


        document.getElementById(
            "packingSize"
        ).value = "";


        document.getElementById(
            "pcsPerCarton"
        ).value = "";


    } catch (error) {

        console.error(error);

        showMessage(
            "Server error. Please check browser console.",
            false
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "Create Product";

    }

}


/*
|--------------------------------------------------------------------------
| Message
|--------------------------------------------------------------------------
*/

function showMessage(
    message,
    success
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        message;


    element.className =
        "message " +
        (
            success
                ? "success"
                : "error"
        );


    element.style.display =
        "block";

}


function clearMessage() {

    const element =
        document.getElementById(
            "message"
        );


    element.style.display =
        "none";

}


/*
|--------------------------------------------------------------------------
| Back
|--------------------------------------------------------------------------
*/

function goBack() {

    window.location.href =
        "index.html";

}

</script>

</body>

</html>
